# FlxOS Profile: M5Stack Core2
id: m5stack-core2
vendor: M5Stack
name:
  - Core2
  - M5Stack Core2
target: esp32
flash_size: 16MB
flash_mode: DIO
headless: false
inherits: _bases/base-esp32-spi

hardware:
  spiram:
    enabled: true
    speed: 80M
    xip_from_psram: false
    ecc_enable: false
  pmic: axp192
  display:
    enabled: true
    driver: ILI9342
    bus: spi
    width: 320
    height: 240
    color_depth: 16
    size_inches: 2.0
    rotation: 1
    pins:
      cs: 5
      dc: 15
      rst: -1
      busy: -1
      bckl: -1
      mosi: 23
      sclk: 18
      miso: 38
    spi:
      host: 3
      mode: 0
      freq_write: 40000000
      freq_read: 16000000
      three_wire: false
      dma_channel: 0
    backlight:
      freq: 20000
      pwm_channel: -1
      invert: false
    panel:
      offset_x: 0
      offset_y: 0
      offset_rotation: 0
      dummy_read_pixel: 8
      dummy_read_bits: 1
      readable: false
      bus_shared: true
      invert: true
      rgb_order: false
      dlen_16bit: false
  touch:
    enabled: true
    driver: FT5X06
    bus: i2c
    pins:
      cs: -1
      int: 39
    i2c:
      port: 0
      addr: 0x38
      sda: 21
      scl: 22
  sdcard:
    enabled: true
    bus: spi
    cs: 4
    spi_host: 3
    max_freq_khz: 4000
    mount_point: /sdcard
    pins:
      mosi: 23
      miso: 38
      sclk: 18
  battery:
    enabled: false

target_config:
  instruction_cache_32kb: true
  data_cache_32kb: true

console:
  usb_serial_jtag: false

cli:
  enabled: true
  prompt: "flxos> "
  max_cmdline_length: 256

capabilities:
  wifi: true
  bluetooth: true
  ble: true
  gps: false
  lora: false
  camera: false
  audio: false
  keyboard: false
  trackball: false

distribution:
  incubating: true
  tags:
    - spi
    - ili9342
    - 2.0-inch
    - touch
    - axp192
