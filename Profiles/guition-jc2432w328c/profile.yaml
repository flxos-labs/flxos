# FlxOS Profile: Guition JC2432W328C
id: guition-jc2432w328c
vendor: Guition
name:
  - JC2432W328C
  - Guition JC2432W328C
target: esp32
flash_size: 4MB
flash_mode: DIO
headless: false
inherits: _bases/base-esp32-spi

hardware:
  spiram:
    enabled: false
  display:
    enabled: true
    driver: ST7789
    bus: spi
    width: 240
    height: 320
    color_depth: 16
    size_inches: 2.8
    rotation: 0
    pins:
      cs: 15
      dc: 2
      rst: -1
      busy: -1
      bckl: 27
      mosi: 13
      sclk: 14
      miso: -1
    spi:
      host: 2
      mode: 0
      freq_write: 40000000
      freq_read: 16000000
      three_wire: false
      dma_channel: 0
    backlight:
      freq: 20000
      pwm_channel: 0
      invert: false
    panel:
      offset_x: 0
      offset_y: 0
      offset_rotation: 0
      dummy_read_pixel: 8
      dummy_read_bits: 1
      readable: false
      bus_shared: false
      invert: false
      rgb_order: false
      dlen_16bit: false
  touch:
    enabled: true
    driver: CST816S
    bus: i2c
    pins:
      cs: -1
      int: -1
    i2c:
      port: 0
      addr: 0x15
      sda: 33
      scl: 32
  sdcard:
    enabled: true
    bus: spi
    cs: 5
    spi_host: 3
    max_freq_khz: 20000
    mount_point: /sdcard
    pins:
      mosi: 23
      miso: 19
      sclk: 18
  battery:
    enabled: false

target_config:
  instruction_cache_32kb: true
  data_cache_32kb: true

console:
  usb_serial_jtag: false

cli:
  enabled: true
  prompt: "flxos> "
  max_cmdline_length: 256

capabilities:
  wifi: true
  bluetooth: true
  ble: true
  gps: false
  lora: false
  camera: false
  audio: false

distribution:
  incubating: true
  tags:
    - spi
    - st7789
    - 2.8-inch
    - touch
    - cst816s
    - guition
