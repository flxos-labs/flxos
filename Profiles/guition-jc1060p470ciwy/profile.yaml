# FlxOS Profile: Guition JC1060P470C-I-W-Y (7" 1024x600 MIPI DSI, ESP32-P4)
id: guition-jc1060p470ciwy
vendor: Guition
name:
  - JC1060P470C-I-W-Y
  - Guition JC1060P470C-I-W-Y
target: esp32p4
flash_size: 16MB
flash_mode: QIO
headless: false
inherits: _bases/base-esp32-spi

hardware:
  spiram:
    enabled: true
    mode: OCT
    speed: 200M
  display:
    enabled: true
    driver: JD9165
    bus: mipi_dsi
    width: 1024
    height: 600
    color_depth: 16
    size_inches: 7.0
    rotation: 0
    pins:
      cs: -1
      dc: -1
      rst: 0
      busy: -1
      bckl: 23
      mosi: -1
      sclk: -1
      miso: -1
    backlight:
      freq: 20000
      pwm_channel: 0
      invert: false
    panel:
      offset_x: 0
      offset_y: 0
      offset_rotation: 0
      dummy_read_pixel: 8
      dummy_read_bits: 1
      readable: false
      bus_shared: false
      invert: false
      rgb_order: false
      dlen_16bit: false
  touch:
    enabled: true
    driver: GT911
    bus: i2c
    pins:
      cs: -1
      int: -1
    i2c:
      port: 0
      addr: 0x5D
      sda: 7
      scl: 8
  sdcard:
    enabled: true
    bus: sdmmc
    slot: 0
    bus_width: 4
    max_freq_khz: 20000
    mount_point: /sdcard
  battery:
    enabled: true
    driver: ADC
    adc_channel: 4
    adc_unit: 2
    atten: DB_12
    upper_resistor: 85000
    lower_resistor: 100000

target_config:
  instruction_cache_32kb: true
  data_cache_32kb: true

console:
  usb_serial_jtag: true

cli:
  enabled: true
  prompt: "flxos> "
  max_cmdline_length: 256

capabilities:
  wifi: true
  bluetooth: true
  ble: true
  gps: false
  lora: false
  camera: false
  audio: true

lvgl:
  font_size: 18
  theme: Dark
  ui_density: normal

sdkconfig:
  CONFIG_WIFI_PROV_SCAN_MAX_ENTRIES: 16
  CONFIG_WIFI_PROV_AUTOSTOP_TIMEOUT: 30
  CONFIG_WIFI_PROV_STA_ALL_CHANNEL_SCAN: "y"
  CONFIG_ESP_HOSTED_ENABLED: "y"
  CONFIG_ESP_HOSTED_P4_DEV_BOARD_FUNC_BOARD: "y"
  CONFIG_ESP_HOSTED_SDIO_HOST_INTERFACE: "y"
  CONFIG_SLAVE_IDF_TARGET_ESP32C6: "y"
  CONFIG_ESP_HOSTED_USE_MEMPOOL: "n"

distribution:
  incubating: false
  tags:
    - mipi-dsi
    - jd9165
    - 7.0-inch
    - touch
    - gt911
    - guition
