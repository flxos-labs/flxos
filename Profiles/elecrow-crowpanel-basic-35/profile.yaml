# FlxOS Profile: Elecrow CrowPanel Basic 3.5" 320x480 (ILI9488, XPT2046)
id: elecrow-crowpanel-basic-35
vendor: Elecrow
name:
  - CrowPanel Basic 3.5
  - Elecrow CrowPanel Basic 3.5
target: esp32
flash_size: 4MB
flash_mode: DIO
headless: false
inherits: _bases/base-esp32-spi

hardware:
  spiram:
    enabled: false
  display:
    enabled: true
    driver: ILI9488
    bus: spi
    width: 320
    height: 480
    color_depth: 16
    size_inches: 3.5
    rotation: 1
    pins:
      cs: 15
      dc: 2
      rst: -1
      busy: -1
      bckl: 27
      mosi: 13
      sclk: 14
      miso: 33
    spi:
      host: 2
      mode: 0
      freq_write: 40000000
      freq_read: 16000000
      three_wire: false
      dma_channel: 0
    backlight:
      freq: 20000
      pwm_channel: 0
      invert: false
    panel:
      offset_x: 0
      offset_y: 0
      offset_rotation: 0
      dummy_read_pixel: 8
      dummy_read_bits: 1
      readable: false
      bus_shared: true
      invert: false
      rgb_order: false
      dlen_16bit: false
  touch:
    enabled: true
    driver: XPT2046
    bus: spi
    pins:
      cs: 12
      int: -1
    spi:
      host: 2
      freq: 1000000
      bus_shared: true
      separate_pins: false
    calibration:
      x_min: 300
      x_max: 3900
      y_min: 200
      y_max: 3700
      offset_rotation: 0
  sdcard:
    enabled: true
    bus: spi
    cs: 5
    spi_host: 3
    max_freq_khz: 20000
    mount_point: /sdcard
    pins:
      mosi: 23
      miso: 19
      sclk: 18
  battery:
    enabled: false

target_config:
  instruction_cache_32kb: true
  data_cache_32kb: true

console:
  usb_serial_jtag: false

cli:
  enabled: true
  prompt: "flxos> "
  max_cmdline_length: 256

capabilities:
  wifi: true
  bluetooth: true
  ble: true
  gps: false
  lora: false
  camera: false
  audio: false

distribution:
  incubating: false
  tags:
    - spi
    - ili9488
    - 3.5-inch
    - touch
    - xpt2046
    - elecrow
    - crowpanel
