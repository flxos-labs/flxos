# FlxOS Profile: Waveshare ESP32-S3 Touch LCD 4.3" 800x480 (RGB)
id: waveshare-s3-touch-lcd-43
vendor: WaveShare
name:
  - S3 Touch LCD 4.3
  - Waveshare ESP32-S3-Touch-LCD-4.3
target: esp32s3
flash_size: 8MB
flash_mode: QIO
headless: false
inherits: _bases/base-esp32-spi

hardware:
  spiram:
    enabled: true
    mode: OCT
    speed: 120M
  display:
    enabled: true
    driver: RGB
    bus: rgb
    width: 800
    height: 480
    color_depth: 16
    size_inches: 4.3
    rotation: 0
    pins:
      cs: -1
      dc: -1
      rst: -1
      busy: -1
      bckl: -1
      mosi: -1
      sclk: -1
      miso: -1
    rgb:
      freq_write: 16000000
      pclk: 7
      vsync: 3
      hsync: 46
      henable: 5
      d0: 14
      d1: 38
      d2: 18
      d3: 17
      d4: 10
      d5: 39
      d6: 0
      d7: 45
      d8: 48
      d9: 47
      d10: 21
      d11: 1
      d12: 2
      d13: 42
      d14: 41
      d15: 40
      hsync_pulse_width: 4
      hsync_back_porch: 8
      hsync_front_porch: 8
      vsync_pulse_width: 4
      vsync_back_porch: 8
      vsync_front_porch: 8
      hsync_polarity: false
      vsync_polarity: false
      pclk_active_neg: true
      de_idle_high: false
      pclk_idle_high: false
    backlight:
      freq: 20000
      pwm_channel: 0
      invert: false
    panel:
      offset_x: 0
      offset_y: 0
      offset_rotation: 0
      dummy_read_pixel: 8
      dummy_read_bits: 1
      readable: false
      bus_shared: false
      invert: false
      rgb_order: false
      dlen_16bit: false
  touch:
    enabled: true
    driver: GT911
    bus: i2c
    pins:
      cs: -1
      int: -1
    i2c:
      port: 0
      addr: 0x5D
      sda: 8
      scl: 9
  sdcard:
    enabled: true
    bus: spi
    cs: 10
    spi_host: 2
    max_freq_khz: 20000
    mount_point: /sdcard
    pins:
      mosi: 11
      miso: 13
      sclk: 12
  battery:
    enabled: false
  usb:
    tiny_usb: true

target_config:
  instruction_cache_32kb: true
  data_cache_32kb: true

console:
  usb_serial_jtag: true

cli:
  enabled: true
  prompt: "flxos> "
  max_cmdline_length: 256

capabilities:
  wifi: true
  bluetooth: true
  ble: true
  gps: false
  lora: false
  camera: false
  audio: false

lvgl:
  font_size: 18
  theme: Dark
  ui_density: normal

distribution:
  incubating: false
  tags:
    - rgb
    - 4.3-inch
    - touch
    - gt911
    - waveshare
