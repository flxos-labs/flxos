# FlxOS Profile: M5Stack Tab5 - ESP32-P4, 5" 720x1280 MIPI DSI
id: m5stack-tab5
vendor: M5Stack
name:
  - Tab5
  - M5Stack Tab5
target: esp32p4
flash_size: 16MB
flash_mode: QIO
headless: false
inherits: _bases/base-esp32-spi

hardware:
  spiram:
    enabled: true
    mode: HEX
    speed: 200M
  display:
    enabled: true
    driver: ILI9881C
    bus: mipi_dsi
    width: 720
    height: 1280
    color_depth: 16
    size_inches: 5.0
    rotation: 0
    pins:
      cs: -1
      dc: -1
      rst: -1
      busy: -1
      bckl: 22
      mosi: -1
      sclk: -1
      miso: -1
    backlight:
      freq: 5000
      pwm_channel: 0
      invert: false
    panel:
      offset_x: 0
      offset_y: 0
      offset_rotation: 0
      dummy_read_pixel: 8
      dummy_read_bits: 1
      readable: false
      bus_shared: false
      invert: false
      rgb_order: false
      dlen_16bit: false
  touch:
    enabled: true
    driver: GT911
    bus: i2c
    pins:
      cs: -1
      int: 23
    i2c:
      port: 0
      addr: 0x5D
      sda: 31
      scl: 32
  sdcard:
    enabled: true
    bus: sdmmc
    slot: 0
    bus_width: 4
    max_freq_khz: 20000
    mount_point: /sdcard
  battery:
    enabled: true
    driver: INA226
    i2c_port: 0
    i2c_addr: 0x41
  keyboard:
    enabled: true
  usb:
    tiny_usb: true
    usb_host: true

target_config:
  instruction_cache_32kb: true
  data_cache_32kb: true

console:
  usb_serial_jtag: true

cli:
  enabled: true
  prompt: "flxos> "
  max_cmdline_length: 256

capabilities:
  wifi: true
  bluetooth: true
  ble: true
  gps: false
  lora: false
  camera: false
  audio: true
  keyboard: true

lvgl:
  font_size: 28
  theme: Dark
  ui_density: compact

sdkconfig:
  CONFIG_WIFI_PROV_SCAN_MAX_ENTRIES: 16
  CONFIG_WIFI_PROV_AUTOSTOP_TIMEOUT: 30
  CONFIG_WIFI_PROV_STA_ALL_CHANNEL_SCAN: "y"
  CONFIG_SLAVE_IDF_TARGET_ESP32C6: "y"
  CONFIG_ESP_HOSTED_ENABLED: "y"
  CONFIG_ESP_HOSTED_SDIO_HOST_INTERFACE: "y"
  CONFIG_ESP_HOSTED_SDIO_SLOT_1: "y"
  CONFIG_ESP_HOSTED_PRIV_SDIO_PIN_CMD_SLOT_1: 13
  CONFIG_ESP_HOSTED_PRIV_SDIO_PIN_CLK_SLOT_1: 12
  CONFIG_ESP_HOSTED_PRIV_SDIO_PIN_D0_SLOT_1: 11
  CONFIG_ESP_HOSTED_PRIV_SDIO_PIN_D1_4BIT_BUS_SLOT_1: 10
  CONFIG_ESP_HOSTED_PRIV_SDIO_PIN_D2_4BIT_BUS_SLOT_1: 9
  CONFIG_ESP_HOSTED_PRIV_SDIO_PIN_D3_4BIT_BUS_SLOT_1: 8
  CONFIG_ESP_HOSTED_SDIO_GPIO_RESET_SLAVE: 15
  CONFIG_ESP_HOSTED_USE_MEMPOOL: "n"
  CONFIG_CACHE_L2_CACHE_256KB: "y"
  CONFIG_LVGL_PORT_ENABLE_PPA: "y"
  CONFIG_LV_DRAW_BUF_ALIGN: 64
  CONFIG_LV_DEF_REFR_PERIOD: 15

distribution:
  incubating: false
  tags:
    - mipi-dsi
    - ili9881c
    - 5.0-inch
    - touch
    - gt911
    - m5stack
    - keyboard
