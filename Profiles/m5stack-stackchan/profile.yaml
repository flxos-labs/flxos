# FlxOS Profile: M5Stack StackChan
id: m5stack-stackchan
vendor: M5Stack
name:
  - StackChan
  - M5Stack StackChan
target: esp32s3
flash_size: 16MB
flash_mode: QIO
headless: false
inherits: _bases/base-esp32-spi

hardware:
  spiram:
    enabled: true
    speed: 80M
    xip_from_psram: false
    ecc_enable: false
  pmic: axp2101
  display:
    enabled: true
    driver: ILI9342
    bus: spi
    width: 320
    height: 240
    color_depth: 16
    size_inches: 2.0
    rotation: 1
    pins:
      cs: 3
      dc: 35
      rst: -1
      busy: -1
      bckl: -1
      mosi: 37
      sclk: 36
      miso: 35
    spi:
      host: 3
      mode: 0
      freq_write: 40000000
      freq_read: 16000000
      three_wire: false
      dma_channel: 0
    backlight:
      freq: 20000
      pwm_channel: -1
      invert: false
    panel:
      offset_x: 0
      offset_y: 0
      offset_rotation: 0
      dummy_read_pixel: 8
      dummy_read_bits: 1
      readable: false
      bus_shared: true
      invert: true
      rgb_order: false
      dlen_16bit: false
  touch:
    enabled: true
    driver: FT5X06
    bus: i2c
    pins:
      cs: -1
      int: -1
    i2c:
      port: 0
      addr: 0x38
      sda: 12
      scl: 11
  sdcard:
    enabled: true
    bus: spi
    cs: 4
    spi_host: 3
    max_freq_khz: 4000
    mount_point: /sdcard
    pins:
      mosi: 37
      miso: 35
      sclk: 36
  battery:
    enabled: false

target_config:
  instruction_cache_32kb: true
  data_cache_64kb: true
  data_cache_line_64b: true

console:
  usb_serial_jtag: true

cli:
  enabled: true
  prompt: "flxos> "
  max_cmdline_length: 256

capabilities:
  wifi: true
  bluetooth: true
  ble: true
  gps: false
  lora: false
  camera: false
  audio: true

distribution:
  incubating: true
  tags:
    - spi
    - ili9342
    - 2.0-inch
    - touch
    - axp2101
    - m5stack
