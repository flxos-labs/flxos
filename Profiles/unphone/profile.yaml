# FlxOS Profile: unPhone - ESP32-S3, 3.5" 320x480 (HX8357D SPI, XPT2046 touch)
id: unphone
vendor: unPhone
name:
  - unPhone
  - unPhone
target: esp32s3
flash_size: 8MB
flash_mode: QIO
headless: false
inherits: _bases/base-esp32-spi

hardware:
  spiram:
    enabled: true
    mode: OCT
    speed: 80M
  display:
    enabled: true
    driver: HX8357D
    bus: spi
    width: 320
    height: 480
    color_depth: 24
    size_inches: 3.5
    rotation: 1
    pins:
      cs: 48
      dc: 47
      rst: 46
      busy: -1
      bckl: -1
      mosi: 40
      sclk: 39
      miso: 41
    spi:
      host: 2
      mode: 0
      freq_write: 27000000
      freq_read: 16000000
      three_wire: false
      dma_channel: 0
    backlight:
      freq: 0
      pwm_channel: -1
      invert: false
    panel:
      offset_x: 0
      offset_y: 0
      offset_rotation: 0
      dummy_read_pixel: 8
      dummy_read_bits: 1
      readable: false
      bus_shared: true
      invert: false
      rgb_order: false
      dlen_16bit: false
  touch:
    enabled: true
    driver: XPT2046
    bus: spi
    pins:
      cs: 38
      int: -1
    spi:
      host: 2
      freq: 1000000
      bus_shared: true
      separate_pins: false
    calibration:
      x_min: 200
      x_max: 3800
      y_min: 200
      y_max: 3800
      offset_rotation: 0
  sdcard:
    enabled: true
    bus: spi
    cs: 43
    spi_host: 2
    max_freq_khz: 20000
    mount_point: /sdcard
    pins:
      mosi: 40
      miso: 41
      sclk: 39
  battery:
    enabled: false
  usb:
    tiny_usb: false

target_config:
  instruction_cache_32kb: true
  data_cache_32kb: true

console:
  usb_serial_jtag: true

cli:
  enabled: true
  prompt: "flxos> "
  max_cmdline_length: 256

capabilities:
  wifi: true
  bluetooth: true
  ble: true
  gps: false
  lora: false
  camera: false
  audio: false

lvgl:
  font_size: 14
  theme: Dark
  ui_density: normal

distribution:
  incubating: false
  tags:
    - spi
    - hx8357d
    - 3.5-inch
    - touch
    - xpt2046
    - unphone
