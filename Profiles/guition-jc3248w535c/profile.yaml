# FlxOS Profile: Guition JC3248W535C - ESP32-S3, 3.5" 320x480 (AXS15231B QSPI)
id: guition-jc3248w535c
vendor: Guition
name:
  - JC3248W535C
  - Guition JC3248W535C
target: esp32s3
flash_size: 16MB
flash_mode: QIO
headless: false
inherits: _bases/base-esp32-spi

hardware:
  spiram:
    enabled: true
    mode: OCT
    speed: 120M
  display:
    enabled: true
    driver: AXS15231B
    bus: spi
    width: 320
    height: 480
    color_depth: 16
    size_inches: 3.5
    rotation: 0
    pins:
      cs: 45
      dc: -1
      rst: -1
      busy: -1
      bckl: -1
      mosi: 21
      sclk: 47
      miso: 48
    spi:
      host: 2
      mode: 0
      freq_write: 40000000
      freq_read: 16000000
      three_wire: false
      dma_channel: 0
    backlight:
      freq: 20000
      pwm_channel: 0
      invert: false
    panel:
      offset_x: 0
      offset_y: 0
      offset_rotation: 0
      dummy_read_pixel: 8
      dummy_read_bits: 1
      readable: false
      bus_shared: false
      invert: false
      rgb_order: false
      dlen_16bit: false
  touch:
    enabled: true
    driver: AXS15231B
    bus: i2c
    pins:
      cs: -1
      int: -1
    i2c:
      port: 0
      addr: 0x3B
      sda: 4
      scl: 8
  sdcard:
    enabled: true
    bus: spi
    cs: 10
    spi_host: 3
    max_freq_khz: 20000
    mount_point: /sdcard
    pins:
      mosi: 11
      miso: 13
      sclk: 12
  battery:
    enabled: false
  usb:
    tiny_usb: true

target_config:
  instruction_cache_32kb: true
  data_cache_32kb: true

console:
  usb_serial_jtag: true

cli:
  enabled: true
  prompt: "flxos> "
  max_cmdline_length: 256

capabilities:
  wifi: true
  bluetooth: true
  ble: true
  gps: false
  lora: false
  camera: false
  audio: true

lvgl:
  font_size: 16
  theme: Dark
  ui_density: normal

distribution:
  incubating: false
  tags:
    - spi
    - axs15231b
    - 3.5-inch
    - touch
    - guition
