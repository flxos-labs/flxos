# FlxOS Profile: M5Stack StickS3
id: m5stack-sticks3
vendor: M5Stack
name:
  - StickS3
  - M5Stack StickS3
target: esp32s3
flash_size: 8MB
flash_mode: QIO
headless: false
inherits: _bases/base-esp32-spi

hardware:
  spiram:
    enabled: true
    speed: 80M
    xip_from_psram: false
    ecc_enable: false
  display:
    enabled: true
    driver: ST7789
    bus: spi
    width: 135
    height: 240
    color_depth: 16
    size_inches: 1.14
    rotation: 1
    pins:
      cs: 41
      dc: 45
      rst: 21
      busy: -1
      bckl: 38
      mosi: 39
      sclk: 40
      miso: -1
    spi:
      host: 2
      mode: 0
      freq_write: 40000000
      freq_read: 16000000
      three_wire: false
      dma_channel: 0
    backlight:
      freq: 20000
      pwm_channel: 0
      invert: false
    panel:
      offset_x: 52
      offset_y: 40
      offset_rotation: 0
      dummy_read_pixel: 8
      dummy_read_bits: 1
      readable: false
      bus_shared: false
      invert: true
      rgb_order: false
      dlen_16bit: false
  touch:
    enabled: false
  sdcard:
    enabled: true
    bus: spi
    cs: 7
    spi_host: 3
    max_freq_khz: 20000
    mount_point: /sdcard
    pins:
      mosi: 6
      miso: 4
      sclk: 5
  battery:
    enabled: false

target_config:
  instruction_cache_32kb: true
  data_cache_64kb: true
  data_cache_line_64b: true

console:
  usb_serial_jtag: true

cli:
  enabled: true
  prompt: "flxos> "
  max_cmdline_length: 256

capabilities:
  wifi: true
  bluetooth: true
  ble: true
  gps: false
  lora: false
  camera: false
  audio: true

distribution:
  incubating: true
  tags:
    - spi
    - st7789
    - 1.14-inch
    - m5stack
