# FlxOS Profile: Elecrow CrowPanel Advance 3.5"
id: elecrow-crowpanel-advance-35
vendor: Elecrow
name:
  - CrowPanel Advance 3.5"
  - Elecrow CrowPanel Advance 3.5"
target: esp32s3
flash_size: 16MB
flash_mode: QIO
headless: false
inherits: _bases/base-esp32-spi

hardware:
  spiram:
    enabled: true
    speed: 80M
    xip_from_psram: false
    ecc_enable: false
  display:
    enabled: true
    driver: ILI9488
    bus: spi
    width: 320
    height: 480
    color_depth: 16
    size_inches: 3.5
    rotation: 0
    pins:
      cs: 40
      dc: 41
      rst: -1
      busy: -1
      bckl: 38
      mosi: 39
      sclk: 42
      miso: -1
    spi:
      host: 2
      mode: 0
      freq_write: 40000000
      freq_read: 16000000
      three_wire: false
      dma_channel: 0
    backlight:
      freq: 20000
      pwm_channel: 0
      invert: false
    panel:
      offset_x: 0
      offset_y: 0
      offset_rotation: 0
      dummy_read_pixel: 8
      dummy_read_bits: 1
      readable: false
      bus_shared: false
      invert: false
      rgb_order: false
      dlen_16bit: false
  touch:
    enabled: true
    driver: GT911
    bus: i2c
    pins:
      cs: -1
      int: -1
    i2c:
      port: 0
      addr: 0x5D
      sda: 15
      scl: 16
  sdcard:
    enabled: true
    bus: spi
    cs: 7
    spi_host: 3
    max_freq_khz: 20000
    mount_point: /sdcard
    pins:
      mosi: 6
      miso: 4
      sclk: 5
  battery:
    enabled: false

target_config:
  instruction_cache_32kb: true
  data_cache_64kb: true
  data_cache_line_64b: true

console:
  usb_serial_jtag: true

cli:
  enabled: true
  prompt: "flxos> "
  max_cmdline_length: 256

capabilities:
  wifi: true
  bluetooth: true
  ble: true
  gps: false
  lora: false
  camera: false
  audio: false

distribution:
  incubating: true
  tags:
    - spi
    - ili9488
    - 3.5-inch
    - touch
    - gt911
    - elecrow
