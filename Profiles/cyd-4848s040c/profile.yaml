# FlxOS Profile: CYD 4848S040C - ESP32-S3, 4" 480x480 round-ish (ST7701S RGB-SPI)
# Note: ST7701S display crashes in Tactility DisplayDriver; see Source/devices/St7701Display.h
id: cyd-4848s040c
vendor: CYD
name:
  - 4848S040C
  - CYD 4848S040C
target: esp32s3
flash_size: 16MB
flash_mode: QIO
headless: false
inherits: _bases/base-esp32-spi

hardware:
  spiram:
    enabled: true
    mode: OCT
    speed: 80M
  display:
    # ST7701S uses a hybrid SPI-RGB interface; treat as custom/incubating
    enabled: true
    driver: ST7701S
    bus: spi
    width: 480
    height: 480
    color_depth: 16
    size_inches: 4.0
    rotation: 0
    pins:
      cs: -1
      dc: -1
      rst: -1
      busy: -1
      bckl: -1
      mosi: -1
      sclk: -1
      miso: -1
    spi:
      host: 2
      mode: 0
      freq_write: 40000000
      freq_read: 16000000
      three_wire: false
      dma_channel: 0
    backlight:
      freq: 20000
      pwm_channel: 0
      invert: false
    panel:
      offset_x: 0
      offset_y: 0
      offset_rotation: 0
      dummy_read_pixel: 8
      dummy_read_bits: 1
      readable: false
      bus_shared: false
      invert: false
      rgb_order: false
      dlen_16bit: false
  touch:
    enabled: true
    driver: CST816S
    bus: i2c
    pins:
      cs: -1
      int: -1
    i2c:
      port: 0
      addr: 0x15
      sda: 19
      scl: 45
  sdcard:
    enabled: false
  battery:
    enabled: false

target_config:
  instruction_cache_32kb: true
  data_cache_32kb: true

console:
  usb_serial_jtag: true

cli:
  enabled: true
  prompt: "flxos> "
  max_cmdline_length: 256

capabilities:
  wifi: true
  bluetooth: true
  ble: true
  gps: false
  lora: false
  camera: false
  audio: false

distribution:
  incubating: true
  tags:
    - st7701s
    - rgb-spi
    - 4.0-inch
    - touch
    - cst816s
    - cyd
