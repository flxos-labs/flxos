# FlxOS Profile: Elecrow CrowPanel Advance 5.0" 800x480 (RGB)
id: elecrow-crowpanel-advance-50
vendor: Elecrow
name:
  - CrowPanel Advance 5.0
  - Elecrow CrowPanel Advance 5.0
target: esp32s3
flash_size: 16MB
flash_mode: QIO
headless: false
inherits: _bases/base-esp32-spi

hardware:
  spiram:
    enabled: true
    mode: OCT
    speed: 120M
  display:
    enabled: true
    driver: RGB
    bus: rgb
    width: 800
    height: 480
    color_depth: 16
    size_inches: 5.0
    rotation: 0
    pins:
      cs: -1
      dc: -1
      rst: -1
      busy: -1
      bckl: -1
      mosi: -1
      sclk: -1
      miso: -1
    rgb:
      freq_write: 15000000
      pclk: 39
      vsync: 41
      hsync: 40
      henable: 42
      d0: 21
      d1: 47
      d2: 48
      d3: 45
      d4: 38
      d5: 9
      d6: 10
      d7: 11
      d8: 12
      d9: 13
      d10: 14
      d11: 7
      d12: 17
      d13: 18
      d14: 3
      d15: 46
      hsync_pulse_width: 4
      hsync_back_porch: 8
      hsync_front_porch: 8
      vsync_pulse_width: 4
      vsync_back_porch: 8
      vsync_front_porch: 8
      hsync_polarity: false
      vsync_polarity: false
      pclk_active_neg: true
      de_idle_high: false
      pclk_idle_high: false
    backlight:
      freq: 20000
      pwm_channel: 0
      invert: false
    panel:
      offset_x: 0
      offset_y: 0
      offset_rotation: 0
      dummy_read_pixel: 8
      dummy_read_bits: 1
      readable: false
      bus_shared: false
      invert: false
      rgb_order: false
      dlen_16bit: false
  touch:
    enabled: true
    driver: GT911
    bus: i2c
    pins:
      cs: -1
      int: -1
    i2c:
      port: 0
      addr: 0x5D
      sda: 15
      scl: 16
  sdcard:
    enabled: true
    bus: spi
    cs: 0
    spi_host: 2
    max_freq_khz: 20000
    mount_point: /sdcard
    pins:
      mosi: 6
      miso: 4
      sclk: 5
  battery:
    enabled: false
  usb:
    tiny_usb: true

target_config:
  instruction_cache_32kb: true
  data_cache_32kb: true

console:
  usb_serial_jtag: true

cli:
  enabled: true
  prompt: "flxos> "
  max_cmdline_length: 256

capabilities:
  wifi: true
  bluetooth: true
  ble: true
  gps: false
  lora: false
  camera: false
  audio: false

lvgl:
  font_size: 18
  theme: Dark
  ui_density: normal

distribution:
  incubating: false
  tags:
    - rgb
    - 5.0-inch
    - touch
    - gt911
    - elecrow
    - crowpanel
