# FlxOS Profile: Waveshare S3 Touch LCD 1.28" (circular)
id: waveshare-s3-touch-lcd-128
vendor: WaveShare
name:
  - S3 Touch LCD 1.28
  - Waveshare S3 Touch LCD 1.28
target: esp32s3
flash_size: 16MB
flash_mode: QIO
headless: false
inherits: _bases/base-esp32-spi

hardware:
  spiram:
    enabled: true
    mode: QUAD
    speed: 120M
  display:
    enabled: true
    driver: GC9A01
    bus: spi
    width: 240
    height: 240
    color_depth: 16
    size_inches: 1.28
    rotation: 0
    pins:
      cs: 9
      dc: 8
      rst: 14
      busy: -1
      bckl: 2
      mosi: 11
      sclk: 10
      miso: 12
    spi:
      host: 2
      mode: 0
      freq_write: 40000000
      freq_read: 16000000
      three_wire: false
      dma_channel: 0
    backlight:
      freq: 20000
      pwm_channel: 0
      invert: false
    panel:
      offset_x: 0
      offset_y: 0
      offset_rotation: 0
      dummy_read_pixel: 8
      dummy_read_bits: 1
      readable: false
      bus_shared: false
      invert: false
      rgb_order: false
      dlen_16bit: false
  touch:
    enabled: true
    driver: CST816S
    bus: i2c
    pins:
      cs: -1
      int: 5
    i2c:
      port: 0
      addr: 0x15
      sda: 6
      scl: 7
  sdcard:
    enabled: true
    bus: spi
    cs: 18
    spi_host: 3
    max_freq_khz: 20000
    mount_point: /sdcard
    pins:
      mosi: 16
      miso: 15
      sclk: 17
  battery:
    enabled: false
  usb:
    tiny_usb: true

target_config:
  instruction_cache_32kb: true
  data_cache_32kb: true

console:
  usb_serial_jtag: true

cli:
  enabled: true
  prompt: "flxos> "
  max_cmdline_length: 256

capabilities:
  wifi: true
  bluetooth: true
  ble: true
  gps: false
  lora: false
  camera: false
  audio: false

lvgl:
  font_size: 14
  theme: Dark
  ui_density: compact

sdkconfig:
  CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "n"
  CONFIG_SPIRAM_RODATA: "n"
  CONFIG_SPIRAM_XIP_FROM_PSRAM: "n"

distribution:
  incubating: true
  tags:
    - spi
    - gc9a01
    - 1.28-inch
    - circle
    - touch
    - cst816s
    - waveshare
